services:
  relayradio:
    build: .
    image: relayradio:latest
    container_name: relayradio
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Seoul
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me      # 첫 실행 때만 쓰입니다. 로그인 후 바꾸세요.
      BITRATE: "192"                 # MP3 음질(kbps)
      GRACE_SEC: "30"                # 마지막 청취자가 나간 뒤 정지까지 기다리는 시간(초)
      AUTO_UPDATE: "1"               # 시작할 때와 하루에 한 번 yt-dlp 자동 업데이트
      # PUBLIC_URL: "http://192.168.0.10:8000"   # 화면에 보일 주소를 고정하고 싶을 때
      # STREAM_KEY: "something-secret"           # 스트림 주소에 ?key= 를 요구하고 싶을 때
